<!DOCTYPE html>
<html lang="vi">
<head>
<script>
(function () {
    try {
        var theme =
            localStorage.getItem("crm_ui_theme");

        document.documentElement.setAttribute(
            "data-theme",
            theme === "dark"
                ? "dark"
                : "light"
        );

        document.documentElement.removeAttribute(
            "data-crm-theme"
        );
    } catch (e) {
        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );
    }
})();
</script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đặt lại mật khẩu</title>

    <link
        rel="stylesheet"
        href="css/forgot-password.css"
    >
</head>

<body>

<main class="forgot-page">

    <!-- ==================================================
         INITIAL FORM
    =================================================== -->
    <section
        class="forgot-card"
        id="forgotFormState"
    >

        <div class="corporate-brand">

            <div
                class="corporate-logo"
                aria-hidden="true"
            >
                <span class="logo-part logo-a"></span>
                <span class="logo-part logo-b"></span>
                <span class="logo-part logo-c"></span>
            </div>

            <span class="corporate-name">
                Corporate
            </span>

        </div>


        <h1>
            Đặt lại Mật khẩu
        </h1>

        <p class="description">
            Nhập email liên kết với tài khoản để nhận
            <br>
            hướng dẫn khôi phục.
        </p>


        <form
            id="forgotPasswordForm"
            novalidate
        >

            <div class="form-group">

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    id="forgotEmail"
                    name="email"
                    type="email"
                    autocomplete="email"
                >

            </div>


            <button
                class="primary-button"
                type="submit"
            >
                Gửi liên kết
            </button>

        </form>

    </section>


    <!-- ==================================================
         SUCCESS STATE
    =================================================== -->
    <section
        class="forgot-card success-card"
        id="successState"
        hidden
    >

        <div class="corporate-brand">

            <div
                class="corporate-logo"
                aria-hidden="true"
            >
                <span class="logo-part logo-a"></span>
                <span class="logo-part logo-b"></span>
                <span class="logo-part logo-c"></span>
            </div>

            <span class="corporate-name">
                Corporate
            </span>

        </div>


        <div
            class="success-icon"
            aria-hidden="true"
        >
            <svg
                viewBox="0 0 64 64"
            >
                <circle
                    cx="32"
                    cy="32"
                    r="29"
                />
                <path
                    d="M19 33l9 9 18-20"
                />
            </svg>
        </div>


        <h2>
            Liên kết đặt lại mật khẩu
            <br>
            đã được gửi!
        </h2>


        <p class="success-description">
            Vui lòng kiểm tra hộp thư đến của bạn
            <br>
            (hiệu lực 30 phút)
        </p>


        <a
            href="login.html"
            class="back-login"
        >
            Quay lại đăng nhập
        </a>

    </section>

</main>


<script src="js/forgot-password.js"></script>

</body>
</html>
