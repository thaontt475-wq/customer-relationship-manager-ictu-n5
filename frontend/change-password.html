<!DOCTYPE html>
<html lang="vi">

<head>
<script>
(function () {
    try {
        var theme =
            localStorage.getItem("crm_ui_theme");

        document.documentElement.setAttribute(
            "data-theme",
            theme === "dark"
                ? "dark"
                : "light"
        );

        document.documentElement.removeAttribute(
            "data-crm-theme"
        );
    } catch (e) {
        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );
    }
})();
</script>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Đổi mật khẩu</title>

<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/pages/change-password.css">











<link rel="stylesheet" href="css/animations.css">
</head>


<body class="crm-private">


<aside class="crm-sidebar"></aside>

<header class="crm-topbar"></header>


<main class="crm-main change-password-page">

    <section class="change-password-head">

        <p>
            Tài khoản / Bảo mật
        </p>

        <h1>
            Đổi mật khẩu
        </h1>

        <span>
            Cập nhật mật khẩu đăng nhập của tài khoản.
        </span>

    </section>


    <section class="crm-card password-card">

        <header>

            <div class="security-icon">
                <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>
            </div>

            <div>

                <h2>
                    Mật khẩu đăng nhập
                </h2>

                <p>
                    Sử dụng mật khẩu đủ mạnh để bảo vệ tài khoản.
                </p>

            </div>

        </header>


        <form
            id="changePasswordForm"
            novalidate
        >

            <!-- CURRENT PASSWORD -->

            <label>

                Mật khẩu hiện tại
                <em>*</em>

                <div class="password-field">

                    <input
                        id="currentPassword"
                        class="crm-input"
                        type="password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle="currentPassword"
                        aria-label="Hiện mật khẩu"
                    >
                        <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>

                </div>

            </label>


            <!-- NEW PASSWORD -->

            <label>

                Mật khẩu mới
                <em>*</em>

                <div class="password-field">

                    <input
                        id="newPassword"
                        class="crm-input"
                        type="password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle="newPassword"
                        aria-label="Hiện mật khẩu"
                    >
                        <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>

                </div>

            </label>


            <div class="password-rules">

                <span
                    id="ruleLength"
                    class="password-rule"
                >
                    <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg> Ít nhất 8 ký tự
                </span>

                <span
                    id="ruleLetter"
                    class="password-rule"
                >
                    <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg> Có chữ cái
                </span>

                <span
                    id="ruleNumber"
                    class="password-rule"
                >
                    <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg> Có chữ số
                </span>

            </div>


            <!-- CONFIRM -->

            <label>

                Xác nhận mật khẩu mới
                <em>*</em>

                <div class="password-field">

                    <input
                        id="confirmPassword"
                        class="crm-input"
                        type="password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-password-toggle="confirmPassword"
                        aria-label="Hiện mật khẩu"
                    >
                        <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>

                </div>

            </label>


            <div
                id="passwordError"
                class="password-error"
            ></div>


            <div
                id="passwordMessage"
                class="password-message"
            ></div>


            <footer>

                <a
                    href="profile.html"
                    class="crm-btn crm-btn-secondary password-back"
                >
                    Hủy
                </a>

                <button
                    class="crm-btn crm-btn-primary"
                    type="submit"
                >
                    Đổi mật khẩu
                </button>

            </footer>

        </form>

    </section>

</main>

<header class="crm-mobile-header"></header>
<div id="drawerOverlay" class="crm-drawer-overlay"></div>
<aside id="mobileDrawer" class="crm-mobile-drawer"></aside>





<script src="js/pages/change-password.js"></script>
<script src="js/page-transition.js"></script>





<script src="js/theme.js"></script>
<script src="js/shared-shell.js"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-effects.js"></script>
</body>
</html>
