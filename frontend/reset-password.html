<!DOCTYPE html>
<html lang="vi">

<head>
<script>
(function () {
    try {
        var theme =
            localStorage.getItem("crm_ui_theme");

        document.documentElement.setAttribute(
            "data-theme",
            theme === "dark"
                ? "dark"
                : "light"
        );

        document.documentElement.removeAttribute(
            "data-crm-theme"
        );
    } catch (e) {
        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );
    }
})();
</script>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Đặt lại mật khẩu</title>

<link
    rel="stylesheet"
    href="css/forgot-password.css"
>

</head>

<body>

<main class="forgot-page">

<section class="forgot-card">

    <div class="corporate-brand">

        <div
            class="corporate-logo"
            aria-hidden="true"
        >
            <span class="logo-part logo-a"></span>
            <span class="logo-part logo-b"></span>
            <span class="logo-part logo-c"></span>
        </div>

        <span class="corporate-name">
            Corporate
        </span>

    </div>

    <h1>
        Tạo mật khẩu mới
    </h1>

    <p class="description">
        Nhập mật khẩu mới cho tài khoản của bạn.
    </p>

    <form
        id="resetPasswordForm"
        novalidate
    >

        <div class="form-group">

            <label for="newPassword">
                Mật khẩu mới
            </label>

            <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
            >

        </div>

        <div class="form-group">

            <label for="confirmPassword">
                Xác nhận mật khẩu
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
            >

        </div>

        <div
            id="resetError"
            style="
                color:#dc2626;
                margin:10px 0;
                font-size:13px;
            "
        ></div>

        <div
            id="resetSuccess"
            style="
                color:#16a34a;
                margin:10px 0;
                font-size:13px;
            "
        ></div>

        <button
            class="primary-button"
            type="submit"
        >
            Đặt lại mật khẩu
        </button>

    </form>

    <a
        href="login.html"
        class="back-login"
    >
        Quay lại đăng nhập
    </a>

</section>

</main>

<script src="js/reset-password.js"></script>

</body>
</html>
