<!DOCTYPE html>
<html lang="vi">
<head>
<script>
(function () {
    try {
        var theme =
            localStorage.getItem("crm_ui_theme");

        document.documentElement.setAttribute(
            "data-theme",
            theme === "dark"
                ? "dark"
                : "light"
        );

        document.documentElement.removeAttribute(
            "data-crm-theme"
        );
    } catch (e) {
        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );
    }
})();
</script>

<header class="crm-topbar">

    <div class="crm-search">

        <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
        </svg>

        <input id="globalSearch" type="search" placeholder="Tìm kiếm...">
        <kbd>Ctrl K</kbd>

    </div>

</header>


<main class="crm-main audit-page">

    <section class="audit-head">

        <p>
            Quản trị / Audit Log
        </p>

        <h1>
            Nhật ký thay đổi
        </h1>

        <span>
            Theo dõi thay đổi trên dữ liệu nhạy cảm.
        </span>

    </section>


    <section class="crm-card audit-filter">

        <input
            id="auditUser"
            class="crm-input"
            type="search"
            placeholder="Người thực hiện"
        >


        <select
            id="auditObject"
            class="crm-input"
        >
            <option value="">
                Tất cả loại đối tượng
            </option>

            <option>
                Chiết khấu
            </option>

            <option>
                Chỉ tiêu
            </option>

            <option>
                Quyền sở hữu
            </option>

            <option>
                Vai trò người dùng
            </option>
        </select>


        <input
            id="auditFrom"
            class="crm-input"
            type="date"
        >


        <input
            id="auditTo"
            class="crm-input"
            type="date"
        >


        <button
            id="clearAudit"
            class="crm-btn crm-btn-secondary"
            type="button"
        >
            Đặt lại
        </button>

    </section>


    <section class="crm-card audit-table-card">

        <div class="audit-table-scroll">

            <table>

                <thead>
                <tr>
                    <th>Thời điểm</th>
                    <th>Người thực hiện</th>
                    <th>Đối tượng</th>
                    <th>Trường thay đổi</th>
                    <th>Giá trị trước</th>
                    <th>Giá trị sau</th>
                </tr>
                </thead>

                <tbody id="auditBody"></tbody>

            </table>

        </div>


        <div
            id="auditEmpty"
            class="audit-empty"
        >

            <div>
                <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg>
            </div>

            <strong>
                Chưa có dữ liệu Audit
            </strong>

            <span>
                Log thật sẽ xuất hiện khi nối backend.
            </span>

        </div>

    </section>

</main>
