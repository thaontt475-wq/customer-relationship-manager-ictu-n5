<!DOCTYPE html>
<html lang="vi">
<head>
<script>
(function () {
    try {
        var theme =
            localStorage.getItem("crm_ui_theme");

        document.documentElement.setAttribute(
            "data-theme",
            theme === "dark"
                ? "dark"
                : "light"
        );

        document.documentElement.removeAttribute(
            "data-crm-theme"
        );
    } catch (e) {
        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );
    }
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Công việc</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="css/design-system.css?v=20261014_dark2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="css/app-shell.css?v=20261017_v6">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="css/pages/tasks.css?v=20261014_dark2">











<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="css/animations.css?v=20261014_dark2">
</head>

<body class="crm-private">


<aside class="crm-sidebar">

    <div class="crm-brand">
        <div class="crm-brand-mark">C</div>
        <span class="crm-brand-name">Corporate CRM</span>
    </div>

    <nav class="crm-nav">

        <a href="dashboard.html" class="crm-nav-item">
            <span class="crm-nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
            <span class="crm-nav-label">Tổng quan</span>
        </a>

        <a href="customers.html" class="crm-nav-item">
            <span class="crm-nav-icon"><i class="fa-solid fa-building"></i></span>
            <span class="crm-nav-label">Khách hàng</span>
        </a>

        <a href="pipeline.html" class="crm-nav-item">
            <span class="crm-nav-icon"><i class="fa-solid fa-list-check"></i></span>
            <span class="crm-nav-label">Công việc</span>
        </a>

        <a href="calendar.html" class="crm-nav-item">
            <span class="crm-nav-icon"><i class="fa-solid fa-calendar-days"></i></span>
            <span class="crm-nav-label">Lịch</span>
        </a>

    </nav>

    

</aside>


<header class="crm-topbar">

    <div class="crm-search">

        <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
        </svg>

        <input id="globalSearch" type="search" placeholder="Tìm kiếm...">
        <kbd>Ctrl K</kbd>

    </div>

    <div class="crm-top-actions">
        <div class="crm-avatar">U</div>
    </div>

</header>


<main class="crm-main tasks-page">

    <section class="tasks-head">

        <div>

            <p>
                CRM / Công việc
            </p>

            <h1>
                Công việc cần làm
            </h1>

            <span>
                Theo dõi task được tạo trong hệ thống.
            </span>

        </div>


        <button
            id="newTask"
            class="crm-btn crm-btn-primary"
            type="button"
        >
            + Tạo công việc
        </button>

    </section>


    <section class="crm-card tasks-filter">

        <input
            id="taskSearch"
            class="crm-input"
            type="search"
            placeholder="Tìm công việc..."
        >


        <select
            id="taskState"
            class="crm-input"
        >
            <option value="">
                Tất cả trạng thái
            </option>

            <option value="open">
                Đang mở
            </option>

            <option value="done">
                Hoàn thành
            </option>

            <option value="late">
                Quá hạn
            </option>
        </select>


        <select
            id="taskPriorityFilter"
            class="crm-input"
        >
            <option value="">
                Tất cả ưu tiên
            </option>

            <option value="high">
                Cao
            </option>

            <option value="medium">
                Trung bình
            </option>

            <option value="low">
                Thấp
            </option>
        </select>

    </section>


    <section class="crm-card tasks-card">

        <div
            id="tasksList"
            class="tasks-list"
        ></div>


        <div
            id="tasksEmpty"
            class="tasks-empty"
        >
            Chưa có công việc.
        </div>

    </section>

</main>

<header class="crm-mobile-header"></header>
<div id="drawerOverlay" class="crm-drawer-overlay"></div>
<aside id="mobileDrawer" class="crm-mobile-drawer"></aside>


<!-- TASK MODAL -->

<div
    id="taskOverlay"
    class="task-overlay"
></div>


<section
    id="taskModal"
    class="task-modal crm-card"
>

    <header>

        <strong id="taskModalTitle">
            Tạo công việc
        </strong>

        <button
            id="closeTaskModal"
            type="button"
        >
            <svg class="crm-inline-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>

    </header>


    <form id="taskForm">

        <input
            id="editingTaskId"
            type="hidden"
        >


        <label>
            Tiêu đề
            <em>*</em>

            <input
                id="taskTitle"
                class="crm-input"
                type="text"
            >
        </label>


        <label>
            Khách hàng / Cơ hội

            <input
                id="taskRelation"
                class="crm-input"
                type="text"
            >
        </label>


        <div class="task-two-cols">

            <label>
                Hạn hoàn thành

                <input
                    id="taskDate"
                    class="crm-input"
                    type="date"
                >
            </label>


            <label>
                Ưu tiên

                <select
                    id="taskPriority"
                    class="crm-input"
                >
                    <option value="medium">
                        Trung bình
                    </option>

                    <option value="high">
                        Cao
                    </option>

                    <option value="low">
                        Thấp
                    </option>
                </select>
            </label>

        </div>


        <label>
            Người phụ trách

            <input
                id="taskOwner"
                class="crm-input"
                type="text"
            >
        </label>


        <label>
            Mô tả

            <textarea
                id="taskDescription"
                rows="4"
            ></textarea>
        </label>


        <div
            id="taskError"
            class="task-error"
        ></div>


        <footer>

            <button
                id="cancelTask"
                class="crm-btn crm-btn-secondary"
                type="button"
            >
                Hủy
            </button>

            <button
                class="crm-btn crm-btn-primary"
                type="submit"
            >
                Lưu
            </button>

        </footer>

    </form>

</section>





<script src="js/pages/tasks.js"></script>

<script src="js/page-transition.js"></script>




<script src="js/theme.js?v=20261014_v3"></script>
<script src="js/shared-shell.js?v=20261017_v6"></script>
<script src="js/ui-core.js"></script>
<script src="js/ui-effects.js"></script>
</body>
</html>
