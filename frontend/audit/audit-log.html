<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật ký thay đổi dữ liệu (Audit Log) - ICTU CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="audit.css">
</head>
<body>
    <div class="app-layout">
        <div class="main-wrapper">
            <!-- TOPBAR HEADER -->
            <header class="topbar">
                <div class="topbar-search">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Tìm kiếm nhật ký...">
                </div>
                <div class="topbar-user">
                    <button class="btn-icon" title="Thông báo">
                        <i class="fa-regular fa-bell"></i>
                    </button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Pham+Van+A&background=0D8ABC&color=fff&rounded=true" alt="Avatar" class="avatar-sm">
                        <span class="user-name">Phạm Văn A</span>
                        <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                    </div>
                </div>
            </header>

            <!-- NỘI DUNG AUDIT LOG -->
            <main class="page-content">
                <div class="page-title-box">
                    <h2>Nhật ký thay đổi dữ liệu (Audit Log)</h2>
                    <p class="subtitle">Theo dõi mọi thay đổi và hành động trên hệ thống dữ liệu</p>
                </div>

                <!-- KHỐI TÙY CHỌN LỌC NÂNG CAO -->
                <section class="card filter-card">
                    <div class="filter-header">
                        <div class="filter-title">
                            <i class="fa-solid fa-filter"></i>
                            <span>Tùy chọn lọc nâng cao</span>
                        </div>
                        <div class="filter-quick-actions">
                            <span class="quick-action-label">Hành động nhanh</span>
                            <button type="button" class="btn btn-outline-icon" title="Tùy biến cột">
                                <i class="fa-solid fa-sliders"></i>
                            </button>
                            <button type="button" class="btn btn-outline" id="btn-export">
                                <i class="fa-solid fa-download"></i> Xuất dữ liệu
                            </button>
                        </div>
                    </div>

                    <form id="audit-filter-form" class="filter-form">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label for="filter-user">Người thực hiện</label>
                                <select id="filter-user">
                                    <option value="">-- Tất cả --</option>
                                    <option value="Trần Thị Bình">Trần Thị Bình (Director)</option>
                                    <option value="Nông Quang Tiệp">Nông Quang Tiệp (Admin)</option>
                                    <option value="Lý Minh Triết">Lý Minh Triết (Manager)</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label for="filter-action">Hành động</label>
                                <select id="filter-action">
                                    <option value="">-- Hành động --</option>
                                    <option value="Cập nhật">Cập nhật</option>
                                    <option value="Gán quyền">Gán quyền</option>
                                    <option value="Điều chỉnh">Điều chỉnh</option>
                                    <option value="Thêm mới">Thêm mới</option>
                                    <option value="Xóa">Xóa</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label for="filter-entity">Đối tượng</label>
                                <select id="filter-entity">
                                    <option value="">-- Tất cả --</option>
                                    <option value="DISCOUNT">Chiết khấu báo giá</option>
                                    <option value="ROLE">Vai trò người dùng</option>
                                    <option value="QUOTA">Chỉ tiêu doanh số</option>
                                    <option value="CONTRACT">Hợp đồng</option>
                                    <option value="CONFIG">Cấu hình hệ thống</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label for="filter-start-date">Từ ngày</label>
                                <div class="input-date-wrap">
                                    <input type="text" id="filter-start-date" value="15/09/2026">
                                    <i class="fa-regular fa-calendar date-icon"></i>
                                </div>
                            </div>

                            <div class="filter-group">
                                <label for="filter-end-date">Đến ngày</label>
                                <div class="input-date-wrap">
                                    <input type="text" id="filter-end-date" value="24/09/2026">
                                    <i class="fa-regular fa-calendar date-icon"></i>
                                </div>
                            </div>
                        </div>

                        <div class="filter-bottom">
                            <div class="keyword-search">
                                <i class="fa-solid fa-magnifying-glass"></i>
                                <input type="text" id="filter-keyword" placeholder="Tìm kiếm từ khóa...">
                            </div>
                            <div class="action-buttons">
                                <button type="submit" class="btn btn-primary">Lọc dữ liệu</button>
                                <button type="button" class="btn btn-light" id="btn-reset">Đặt lại</button>
                            </div>
                        </div>
                    </form>
                </section>

                <!-- KHỐI BẢNG DỮ LIỆU -->
                <section class="card table-card">
                    <div class="table-responsive">
                        <table class="audit-table">
                            <thead>
                                <tr>
                                    <th>Thời gian</th>
                                    <th>Người thực hiện</th>
                                    <th>Hành động</th>
                                    <th>Đối tượng</th>
                                    <th>Giá trị trước (Before)</th>
                                    <th>Giá trị sau (After)</th>
                                </tr>
                            </thead>
                            <tbody id="audit-tbody">
                                <!-- Dữ liệu JS render tại đây -->
                            </tbody>
                        </table>
                    </div>

                    <!-- THANH PHÂN TRANG -->
                    <div class="pagination-footer">
                        <span class="pagination-info" id="pagination-info">Trang 1/5 | Tổng số: 125 bản ghi</span>
                        <div class="pagination-pages" id="pagination-pages">
                            <button class="page-btn active">1</button>
                            <button class="page-btn">2</button>
                            <button class="page-btn">3</button>
                            <span class="dots">...</span>
                            <button class="page-btn next">Next</button>
                            <button class="page-btn last">Last</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../shared/js/endpoints.js"></script>
    <script src="audit.js"></script>
</body>
</html>
