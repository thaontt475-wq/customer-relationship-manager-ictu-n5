<!DOCTYPE html>
<html lang="vi">
<head>
<script>
(function () {
    try {
        var theme =
            localStorage.getItem("crm_ui_theme");

        document.documentElement.setAttribute(
            "data-theme",
            theme === "dark"
                ? "dark"
                : "light"
        );

        document.documentElement.removeAttribute(
            "data-crm-theme"
        );
    } catch (e) {
        document.documentElement.setAttribute(
            "data-theme",
            "light"
        );
    }
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - CRM</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="brand-logo" aria-hidden="true">
                <span class="swirl swirl-one"></span>
                <span class="swirl swirl-two"></span>
            </div>

            <h1>Màn hình Đăng nhập</h1>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="name@company.com"
                        autocomplete="email"
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Mật khẩu
                    </label>

                    <div class="password-field">

                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                        >

                        <button
                            id="togglePassword"
                            class="password-toggle"
                            type="button"
                            aria-label="Hiện mật khẩu"
                        >
                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"
                                />
                                <circle cx="12" cy="12" r="2.8"/>
                                <path
                                    id="eyeSlash"
                                    d="M4 4l16 16"
                                />
                            </svg>
                        </button>

                    </div>
                </div>


                <button
                    class="login-button"
                    type="submit"
                >
                    Đăng nhập hệ thống
                </button>


                <a
                    class="forgot-link"
                    href="forgot-password.html"
                >
                    Quên mật khẩu?
                </a>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
