# ==============================================================================
# NovaCRM Database Configuration (Development Default)
# KHUYẾN NGHỊ CHO THÀNH VIÊN NHÓM:
# 1. Cấu hình credentials qua biến môi trường (Environment Variables):
#    - CRM_DB_URL
#    - CRM_DB_USERNAME
#    - CRM_DB_PASSWORD
# 2. Hoặc khởi tạo tài khoản crm_user bằng script:
#    powershell -ExecutionPolicy Bypass -File scripts/setup-dev.ps1
# 3. TUYỆT ĐỐI KHÔNG commit mật khẩu cá nhân lên Git repository.
# ==============================================================================
db.url=jdbc:mysql://localhost:3306/crm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
db.username=crm_user
db.password=
db.driver=com.mysql.cj.jdbc.Driver